<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best moments · Biscuits Jam Radio</title>
<meta name="description" content="The most-loved and most talked-about moments on Biscuits Jam Radio. Vote to hear one again.">
<meta name="theme-color" content="#030604">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jam Radio">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Biscuits Jam Radio">
<meta property="og:title" content="Best moments · Biscuits Jam Radio">
<meta property="og:description" content="The most-loved and most talked-about moments on the station. Vote to hear one again.">
<meta property="og:url" content="https://biscomusic.com/best">
<meta property="og:image" content="https://biscomusic.com/static/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="static/fonts/monoton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/chakra-petch-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/app.css">
<meta name="icons" content="static/icons.svg">
<style>
.best li{grid-template-columns:44px 1fr auto;align-items:start;padding:14px}
.best .rank{font-size:22px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.best li:nth-child(-n+3) .rank{color:var(--accent);text-shadow:0 0 10px rgba(93,255,58,.7)}
.best .s a{color:var(--text);text-decoration:none;font-weight:600}
.best .s a:hover{color:var(--accent)}
.best .stats{display:block;font-size:13px;color:var(--dim);margin-top:4px}
.best .quote{display:block;margin-top:8px;font-size:14px;font-weight:400;background:rgba(226,104,255,.08);border:1px solid rgba(226,104,255,.35);border-radius:10px;padding:6px 10px}
.best .quote b{color:var(--accent2);font-weight:600}
.best .when{font-size:12px;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.best .when.now{color:var(--live)}
.best .when .vbtn{min-width:84px}
.best .empty{grid-column:1/-1;color:var(--dim);font-size:14px}
.back{color:var(--accent);text-decoration:none;font-size:14px}
.intro{color:var(--dim);margin:0 0 20px}
@media(max-width:480px){.best li{grid-template-columns:30px 1fr}.best .when{grid-column:2;text-align:left;margin-top:-4px}}
</style>
</head>
<body>
<div class="lasers" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main class="wrap">
  <header>
    <div class="brand">
      <h1 data-oil>BISCUITS <span>JAM</span> RADIO</h1>
      <p class="tagline">All jams, no butter!</p>
    </div>
    <a class="back" href="/"><svg class="i" aria-hidden="true"><use href="static/icons.svg#arrow-left"/></svg><span class="wide">Back to the </span>radio</a>
  </header>

  <h2>Best moments</h2>
  <p class="intro">The most-loved and most talked-about 15 seconds on the station. Want to hear one again? Vote for it to play next.</p>
  <ol class="best" id="list"><li><span class="empty">Loading…</span></li></ol>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="static/station.js"></script>
<script src="static/pwa.js"></script>
<script src="static/oil.js"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const showLine = t => { const d = new Date(t.date+'T12:00:00'); return `${d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · ${t.venue} · ${t.city}`; };
const trackId = t => t.file.split('/').pop().split('?')[0].replace(/\.mp3$/, '');   // drop ?v=<hash>
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

let S, starts = new Map(), total = 0, moments = [], ST = null, toastTimer;

function toast(msg, ic) {
  $('toast').replaceChildren(...(ic ? [icon(ic)] : []), msg); $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 2200);
}

function message(text) { const li = el('li'); li.append(el('span', 'empty', text)); $('list').replaceChildren(li); }

// Seconds until a moment airs next (0 while it's on), from the same clock the player uses.
function wait(m) {
  const now = ((Date.now() - Date.parse(S.epoch)) / 1000) % total;
  const d = ((starts.get(m.track) + m.pos - now) % total + total) % total;
  return d > total - 15 ? 0 : d;
}

function render() {
  if (!moments.length) return message('No reactions yet. Tap the flame while you listen and the best moments will show up here.');
  $('list').replaceChildren(...moments.map((m, k) => {
    const li = el('li');
    const s = el('span', 's');
    const a = el('a', null, `${m.song}${m.jam ? ` (jam ${m.jam})` : ''} @ ${fmt(m.pos)}`);
    a.href = `/?m=${m.track}@${m.pos}` + (m.comment ? `&c=${m.comment.id}` : '');
    s.append(a, el('small', null, showLine(m)));
    const stats = el('span', 'stats');
    for (const [n, ic, label] of [[m.fire, 'flame', 'reactions'], [m.comments, 'message-circle', 'comments']]) {
      if (!n) continue;
      const c = el('span', 'chip' + (ic === 'flame' ? ' hot' : '')); c.append(icon(ic), String(n)); c.title = `${n} ${label}`;
      stats.append(c);
    }
    s.append(stats);
    if (m.comment) {
      const q = el('span', 'quote');
      q.append(el('b', null, m.comment.nickname || 'anonymous'), document.createTextNode(': ' + m.comment.body));
      s.append(q);
    }
    // Status cell: a Vote button (kept between ticks so a tap isn't lost) or a status line.
    const w = el('span', 'when'); w.dataset.k = k;
    const btn = el('button', 'ghost vbtn', 'Vote'); btn.hidden = true;
    btn.onclick = () => vote(m);
    btn.setAttribute('aria-label', `Vote for ${m.song}${m.jam ? ` (jam ${m.jam})` : ''} to play next`);
    w.append(el('span', 'status'), btn);
    li.append(el('span', 'rank', k + 1), s, w);
    return li;
  }));
  tick();
}

// With voting, when a moment airs next depends on listeners, so each row offers a vote instead.
function tick() {
  for (const w of document.querySelectorAll('.when')) {
    const m = moments[w.dataset.k], status = w.querySelector('.status'), btn = w.querySelector('.vbtn');
    let text = '', canVote = false, onAir = false;
    if (!ST) {
      const d = wait(m); onAir = d === 0; text = onAir ? 'on air now' : `airs in ${fmt(d)}`;
    } else if (m.track === ST.track) {
      const off = (Date.now() - ST.started_at) / 1000;
      onAir = true; text = off < m.pos ? `on air · in ${fmt(m.pos - off)}` : 'on air now';
    } else if (ST.next?.track === m.track) { onAir = true; text = 'up next!'; }
    else if (Station.myVote(ST.round) === m.track) text = 'you voted';
    else { const why = Station.blocked(ST, m.track); if (why) text = why.toLowerCase(); else canVote = true; }
    w.classList.toggle('now', onAir);
    status.textContent = text; status.hidden = canVote; btn.hidden = !canVote;
  }
}

async function vote(m) {
  if (!ST) return;
  const { view, error, stale } = await Station.vote(ST.round, m.track);
  if (error) { toast(error); if (stale) ST = await Station.get(); }
  else { ST = view; toast(`Voted for ${m.song}${m.jam ? ` (jam ${m.jam})` : ''}. Head back to hear it!`, 'vote'); }
  tick();
}

Promise.all([
  fetch('schedule.json').then(r => r.json()),
  fetch('/api/best').then(r => r.ok ? r.json() : null).catch(() => null),
  Station.get(),
]).then(([schedule, best, station]) => {
  ST = station;
  if (ST) setInterval(async () => { if (document.visibilityState === 'visible') { ST = await Station.get() || ST; } }, 10000);
  S = schedule;
  S.tracks.forEach(t => { starts.set(trackId(t), total); total += t.duration; });
  if (!best) return message('Best moments are only available on biscomusic.com.');
  moments = best.moments;
  render(); setInterval(tick, 1000);
});
</script>
</body>
</html>
