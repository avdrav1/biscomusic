<!doctype html>
<!-- Source for static/og.png (1200x630 link preview). Regenerate with art/render.sh -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Chakra Petch';font-weight:500;src:url(../static/fonts/chakra-petch-500.woff2)}
@font-face{font-family:'Chakra Petch';font-weight:600;src:url(../static/fonts/chakra-petch-600.woff2)}
@font-face{font-family:'Monoton';src:url(../static/fonts/monoton-400.woff2)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:
    radial-gradient(520px 240px at 25% 92%,rgba(226,104,255,.30),transparent 70%),
    radial-gradient(520px 240px at 75% 90%,rgba(155,92,255,.26),transparent 70%),
    radial-gradient(420px 180px at 8% 0%,rgba(111,214,255,.18),transparent 70%),
    radial-gradient(420px 180px at 92% 0%,rgba(111,214,255,.18),transparent 70%),#030604;
  color:#eafbe6;font-family:'Chakra Petch',sans-serif;position:relative}
.lasers{position:absolute;inset:0;mix-blend-mode:screen;opacity:.55}
.lasers i{position:absolute;bottom:-4%;width:1900px;height:1200px;left:var(--x);transform:translateX(-50%) rotate(var(--r,0deg));transform-origin:50% 100%;
  background:repeating-conic-gradient(from 0deg at 50% 100%,transparent 0deg 2.6deg,var(--c,rgba(93,255,58,.8)) 2.6deg 2.8deg);
  clip-path:polygon(50% 100%,0 0,100% 0);
  -webkit-mask-image:radial-gradient(ellipse 55% 100% at 50% 100%,#000 0%,rgba(0,0,0,.55) 45%,transparent 95%)}
.lasers i:nth-child(1){--x:28%;--r:-6deg}.lasers i:nth-child(2){--x:50%}.lasers i:nth-child(3){--x:72%;--r:6deg}
.lasers i:nth-child(4){--x:50%;--r:3deg;--c:rgba(226,104,255,.4)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.wrap{position:absolute;left:84px;top:84px;right:84px}
.live{display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:600;letter-spacing:.2em;color:#ff4d8d;border:2px solid rgba(255,77,141,.5);padding:8px 18px;border-radius:999px;background:rgba(3,6,4,.6);box-shadow:0 0 22px rgba(255,77,141,.3) inset}
.live i{width:12px;height:12px;border-radius:50%;background:#ff4d8d;box-shadow:0 0 12px #ff4d8d}
h1{font:400 78px/1 'Monoton';margin:40px 0 26px;letter-spacing:.03em;white-space:nowrap;text-shadow:0 0 30px rgba(3,6,4,.9)}
h1 span{color:#5dff3a;text-shadow:0 0 6px #5dff3a,0 0 24px rgba(93,255,58,.7)}
p{font-size:34px;font-weight:500;line-height:1.3;color:#cfe3d6;margin:0;max-width:900px;text-shadow:0 2px 12px #030604}
.url{position:absolute;right:84px;top:96px;font-size:26px;font-weight:600;color:#5dff3a;letter-spacing:.06em;text-shadow:0 0 12px rgba(93,255,58,.5)}
</style></head><body>
<div class="lasers"><i></i><i></i><i></i><i></i></div>
<div class="scan"></div>
<div class="url">biscomusic.com</div>
<div class="wrap">
  <div class="live"><i></i>ON AIR</div>
  <h1>BISCUITS <span>JAM</span> RADIO</h1>
  <p>Disco Biscuits jams, broadcast around the clock. Everyone hears the same moment.</p>
</div>
</body></html>
