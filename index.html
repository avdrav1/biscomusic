<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biscuits Jam Radio</title>
<meta name="description" content="Disco Biscuits jams, broadcast around the clock. Everyone hears the same moment — react and comment as it plays.">
<meta name="theme-color" content="#030604">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jam Radio">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Biscuits Jam Radio">
<meta property="og:title" content="Biscuits Jam Radio">
<meta property="og:description" content="Disco Biscuits jams, broadcast around the clock. Everyone hears the same moment.">
<meta property="og:url" content="https://biscomusic.com/">
<meta property="og:image" content="https://biscomusic.com/static/og.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Biscuits Jam Radio">
<meta name="twitter:description" content="Disco Biscuits jams, broadcast around the clock. Everyone hears the same moment.">
<meta name="twitter:image" content="https://biscomusic.com/static/og.png">
<link rel="preload" href="static/fonts/monoton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/chakra-petch-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<div class="lasers" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main class="wrap">
  <header>
    <h1>BISCUITS <span>JAM</span> RADIO</h1>
    <div class="live" id="live"><i></i>ON AIR</div>
  </header>

  <section class="moment" id="moment" hidden>
    <div class="label">Shared moment</div>
    <div class="msong" id="msong"></div>
    <div class="show" id="mshow"></div>
    <div class="pop" id="mcomment" hidden></div>
    <div class="row"><span class="mwhen" id="mwhen"></span><button class="stop" id="mclose">Dismiss</button></div>
  </section>

  <section class="now">
    <div class="label">Now playing<span class="count" id="count" hidden></span></div>
    <div class="song" id="song">Loading…</div>
    <div><span class="jam" id="jam"></span></div>
    <div class="show" id="show"></div>
    <canvas id="heat" hidden aria-hidden="true"></canvas>
    <div class="bar" id="bar" role="progressbar" aria-label="Track progress" aria-valuemin="0"><div id="prog"></div></div>
    <div class="times"><span id="el">0:00</span><span id="rem"></span></div>
    <div class="controls">
      <button id="tune" aria-label="Tune in">▶ Tune in</button>
      <label class="label vol">Vol <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></label>
      <button class="ghost fire" id="fire" hidden title="This part rules" aria-label="React with fire">🔥</button>
      <button class="ghost" id="cbtn" hidden aria-label="Comment on this moment">💬<span class="wide"> Comment</span></button>
      <button class="ghost" id="share" hidden title="Share this moment" aria-label="Share this moment">🔗</button>
      <div class="eq" id="eq"><b></b><b></b><b></b><b></b></div>
    </div>
    <div class="pops" id="pops" aria-live="polite"></div>
  </section>

  <form class="cform" id="cform" hidden>
    <div class="label" id="cat">Comment at 0:00</div>
    <input id="cnick" maxlength="24" aria-label="Nickname (optional)" placeholder="Nickname (optional)" autocomplete="nickname">
    <textarea id="cbody" maxlength="280" aria-label="Your comment" placeholder="What's happening in the jam?" required></textarea>
    <div id="ts"></div>
    <div class="row">
      <button type="submit" id="cpost">Post</button>
      <button type="button" class="stop" id="ccancel">Cancel</button>
      <span class="msg" id="cmsg"></span>
      <span class="count" id="ccount">0/280</span>
    </div>
  </form>

  <section id="talk" hidden>
    <h2 class="split">Moments in this track <a href="/best">Best moments →</a></h2>
    <ol class="cl" id="clist"></ol>
  </section>

  <h2>Coming up</h2>
  <ol id="next"></ol>

  <p class="note">Every listener hears the same moment of the broadcast. Stopping and tuning back in drops you at the live point, just like radio.</p>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<audio id="a" preload="auto"></audio>
<audio id="b" preload="auto"></audio>
<script>
const $ = id => document.getElementById(id);
const decks = [$('a'), $('b')];
let audio = decks[0];
let S, starts = [], total = 0, listening = false, curIdx = -1, shownIdx = -1;   // curIdx: on the deck; shownIdx: on screen

const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const showLine = t => { const d = new Date(t.date+'T12:00:00'); return `${d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · ${t.venue} · ${t.city}`; };
const jamLine = t => t.jam ? `Jam ${t.jam}` : '';

function live() {
  const pos = ((Date.now() - Date.parse(S.epoch)) / 1000) % total;
  let i = starts.findIndex((s, k) => pos < s + S.tracks[k].duration);
  if (i < 0) i = 0;
  return { i, offset: pos - starts[i], pos };
}

function render() {
  const { i, offset } = live();
  const t = S.tracks[i];
  if (i !== shownIdx) {
    shownIdx = i;
    $('song').textContent = t.song;
    $('jam').textContent = jamLine(t);
    $('show').textContent = showLine(t);
    document.title = `${t.song} · Biscuits Jam Radio`;
    renderNext(i, offset);
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({
      title: t.song + (t.jam ? ` (jam ${t.jam})` : ''), artist: 'The Disco Biscuits', album: showLine(t),
      artwork: [{ src: '/static/icon-512.png', sizes: '512x512', type: 'image/png' }, { src: '/static/icon-192.png', sizes: '192x192', type: 'image/png' }] });
  }
  const el = listening && audio.currentTime && curIdx === i ? audio.currentTime : offset;
  $('prog').style.width = (100 * el / t.duration) + '%';
  $('bar').setAttribute('aria-valuemax', Math.round(t.duration));
  $('bar').setAttribute('aria-valuenow', Math.round(el));
  $('bar').setAttribute('aria-valuetext', `${fmt(el)} of ${fmt(t.duration)}`);
  $('el').textContent = fmt(el);
  $('rem').textContent = '-' + fmt(t.duration - el);
  if (C.on) renderComments(i, el);
  renderMoment();
  if (listening && navigator.mediaSession?.setPositionState) {
    try { navigator.mediaSession.setPositionState({ duration: t.duration, position: Math.min(el, t.duration), playbackRate: 1 }); } catch (e) {}
  }
}

function renderNext(i, offset) {
  const now = Date.now(); let at = now + (S.tracks[i].duration - offset) * 1000;
  const rows = [`<li class="cur"><span class="t">NOW</span><span class="s">${S.tracks[i].song}${S.tracks[i].jam?` <span class="jam">· jam ${S.tracks[i].jam}</span>`:''}<small>${showLine(S.tracks[i])}</small></span><span class="d">${fmt(S.tracks[i].duration)}</span></li>`];
  for (let k = 1; k <= 8; k++) {
    const t = S.tracks[(i + k) % S.tracks.length];
    const clock = new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    rows.push(`<li><span class="t">${clock}</span><span class="s">${t.song}${t.jam?` <span class="jam">· jam ${t.jam}</span>`:''}<small>${showLine(t)}</small></span><span class="d">${fmt(t.duration)}</span></li>`);
    at += t.duration * 1000;
  }
  $('next').innerHTML = rows.join('');
}

// Two decks: `audio` is on air, the spare preloads the next track so the handoff is gapless.
const PRELOAD_SECONDS = 45;
let gen = 0, retryDelay = 1000, cued = -1;   // cued = track index loaded on the spare deck
const spare = () => decks[audio === decks[0] ? 1 : 0];
const clear = d => { d.pause(); d.removeAttribute('src'); d.load(); };

function loaded(d) {
  return new Promise((ok, fail) => {
    if (d.readyState >= 1) return ok();
    const done = f => () => { d.removeEventListener('loadedmetadata', yes); d.removeEventListener('error', no); f(); };
    const yes = done(ok), no = done(() => fail(new Error('load failed')));
    d.addEventListener('loadedmetadata', yes); d.addEventListener('error', no);
  });
}

// (Re)join the live point. Each call bumps `gen`, so a stale load or retry can't take over.
async function tune() {
  const g = ++gen;
  const { i } = live();
  if (cued === i) { const old = audio; audio = spare(); clear(old); }
  else { clear(spare()); audio.src = S.tracks[i].file; }
  cued = -1; curIdx = i;
  try {
    await loaded(audio);
    if (g !== gen) return;
    audio.currentTime = live().offset;
    await audio.play();
    retryDelay = 1000;
  } catch (e) {
    if (g !== gen || !listening) return;
    if (e.name === 'NotAllowedError') return stop();
    setTimeout(() => g === gen && listening && tune(), retryDelay);
    retryDelay = Math.min(retryDelay * 2, 15000);
  }
  render();
}

// Track ended: start the cued spare right away; fall back to a normal tune if it isn't ready.
async function handoff() {
  const n = (curIdx + 1) % S.tracks.length, next = spare();
  if (cued !== n || next.readyState < 3) return tune();
  const old = audio, g = ++gen;
  audio = next; curIdx = n; cued = -1;
  try { next.currentTime = 0; await next.play(); clear(old); render(); }
  catch (e) { if (g === gen) { audio = old; tune(); } }
}

function preloadNext() {
  if (!listening || audio.paused || !audio.duration) return;
  const n = (curIdx + 1) % S.tracks.length;
  if (cued === n || audio.duration - audio.currentTime > PRELOAD_SECONDS) return;
  const d = spare(); d.src = S.tracks[n].file; d.preload = 'auto'; d.load(); cued = n;
}

function start() { listening = true; if (navigator.mediaSession) navigator.mediaSession.playbackState = 'playing'; $('tune').textContent = '■ Stop'; $('tune').setAttribute('aria-label', 'Stop'); $('tune').className = 'stop'; $('live').classList.add('on'); $('eq').classList.add('on'); tune(); heartbeat(); }
function stop() { listening = false; if (navigator.mediaSession) navigator.mediaSession.playbackState = 'none'; gen++; decks.forEach(clear); cued = -1; curIdx = -1; $('tune').textContent = '▶ Tune in'; $('tune').setAttribute('aria-label', 'Tune in'); $('tune').className = ''; $('live').classList.remove('on'); $('eq').classList.remove('on'); heartbeat(true); }

decks.forEach(d => {
  d.addEventListener('ended', e => listening && e.target === audio && handoff());
  d.addEventListener('error', e => {
    if (e.target !== audio) { if (!e.target.getAttribute('src')) return; cued = -1; return; }
    // Load failures are retried by tune(); this only handles errors after the track loaded.
    if (listening && audio.readyState >= 1) { const g = gen; setTimeout(() => g === gen && listening && tune(), retryDelay); retryDelay = Math.min(retryDelay * 2, 15000); }
  });
  d.addEventListener('timeupdate', e => e.target === audio && preloadNext());
  d.volume = 0.9;
});
$('tune').onclick = () => listening ? stop() : start();

// Lock screen / headset / car controls. It's radio: pause stops, play rejoins the live point, no seeking.
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession, set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
  set('play', () => { if (!listening) start(); });
  set('pause', () => { if (listening) stop(); });
  set('stop', () => { if (listening) stop(); });
  ['seekbackward', 'seekforward', 'seekto', 'previoustrack', 'nexttrack'].forEach(a => set(a, null));
}
$('vol').oninput = e => decks.forEach(d => d.volume = e.target.value);

// Drift correction: stay within 2s of the live point
// (compares positions across the whole broadcast, so a handoff a moment early isn't undone)
setInterval(() => {
  if (!listening || audio.paused || audio.seeking || curIdx < 0) return;
  const { i, offset, pos } = live();
  let d = pos - (starts[curIdx] + audio.currentTime);
  if (d > total / 2) d -= total; else if (d < -total / 2) d += total;
  if (Math.abs(d) <= 2) return;
  if (i !== curIdx) return tune();
  audio.currentTime = offset;
}, 10000);

// Comments: pinned to a moment in a track, so they come back every time that moment airs.
// Only on the live site; server.py has no /api, so locally this stays off.
const C = { on: false, siteKey: '', track: null, list: [], shown: '', draft: null, widget: null, token: null, waiting: null,
            heat: new Map(), bucket: 5, mine: new Set() };   // heat: 5-second slice -> 🔥 count
const POP_SECONDS = 20;

// Listener count: tuned-in tabs check in every minute with a random per-tab id (no IP).
const P = { id: [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join(''), n: 0 };
function showListeners(n) {
  P.n = n;
  $('count').textContent = `${n} listening`;
  $('count').hidden = !n;
}
async function heartbeat(leaving) {
  if (!C.on) return;
  const body = JSON.stringify({ id: P.id, leaving: !!leaving });
  if (leaving) {
    showListeners(Math.max(0, P.n - 1));
    if (navigator.sendBeacon && navigator.sendBeacon('/api/presence', body)) return;
  }
  try {
    const r = await fetch('/api/presence', { method: 'POST', body, keepalive: true });
    if (r.ok) showListeners((await r.json()).listening);
  } catch (e) {}
}
async function pollListeners() {
  if (!C.on) return;
  if (listening) return heartbeat();   // background tabs keep counting while they play
  if (document.visibilityState !== 'visible') return;
  try { const r = await fetch('/api/presence'); if (r.ok) showListeners((await r.json()).listening); } catch (e) {}
}
addEventListener('pagehide', () => listening && heartbeat(true));
const trackId = t => t.file.split('/').pop().split('?')[0].replace(/\.mp3$/, '');   // drop ?v=<hash>
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

function heard() {
  const { i, offset } = live();
  return { i, el: listening && audio.currentTime && curIdx === i ? audio.currentTime : offset };
}

async function loadMoments(track) {
  const q = '?track=' + encodeURIComponent(track);
  const [c, r] = await Promise.all(['/api/comments', '/api/reactions'].map(u =>
    fetch(u + q).then(res => res.ok ? res.json() : null).catch(() => null)));
  if (track !== C.track) return;
  if (c) { C.list = c.comments; C.shown = ''; }
  if (r) { C.bucket = r.bucket; C.heat = new Map(r.counts); }
}

function drawHeat(t, el) {
  const cv = $('heat');
  cv.hidden = !C.heat.size;
  if (cv.hidden) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  // Laser green, turning magenta for the hottest slices; played slices glow, upcoming ones are dimmed.
  const css = getComputedStyle(document.documentElement), color = v => css.getPropertyValue(v).trim();
  const green = g.createLinearGradient(0, 0, 0, H), hot = g.createLinearGradient(0, 0, 0, H);
  green.addColorStop(0, color('--accent')); green.addColorStop(1, color('--accent-deep'));
  hot.addColorStop(0, color('--accent2')); hot.addColorStop(1, color('--violet'));
  const peak = Math.max(...C.heat.values()), max = Math.sqrt(peak), w = Math.max(2, W * C.bucket / t.duration - 1);
  for (const [b, n] of C.heat) {
    const h = Math.max(3, H * Math.sqrt(n) / max), x = W * b * C.bucket / t.duration, played = b * C.bucket <= el;
    const isHot = peak >= 3 && n >= peak * 0.66;
    g.globalAlpha = played ? 1 : 0.35;
    g.shadowColor = isHot ? color('--accent2') : color('--accent'); g.shadowBlur = played ? 8 : 0;
    g.fillStyle = isHot ? hot : green; g.fillRect(x, H - h, w, h);
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
}

function react() {
  const { i, el } = heard(), track = trackId(S.tracks[i]), b = Math.floor(el / C.bucket);
  const r = $('fire').getBoundingClientRect(), f = document.createElement('span');
  f.className = 'flame'; f.textContent = '🔥';
  f.style.left = (r.left + r.width / 2 - 11) + 'px'; f.style.top = (r.top - 6) + 'px';
  f.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
  document.body.append(f); setTimeout(() => f.remove(), 1200);
  const key = track + '|' + b;
  if (C.mine.has(key)) return;   // one per listener per slice; the server enforces it too
  C.mine.add(key);
  if (track === C.track) { C.heat.set(b, (C.heat.get(b) || 0) + 1); render(); }
  fetch('/api/reactions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ track, pos: Math.round(el * 10) / 10 }) }).catch(() => {});
}

function commentNode(tag, c, cls) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  const at = document.createElement('small'); at.textContent = fmt(c.pos);
  const who = document.createElement('b'); who.textContent = c.nickname || 'anonymous';
  n.append(at, who, document.createTextNode(': ' + c.body));
  return n;
}

function renderComments(i, el) {
  const t = S.tracks[i], id = trackId(t);
  if (id !== C.track) { C.track = id; C.list = []; C.heat = new Map(); C.shown = ''; loadMoments(id); }
  drawHeat(t, el);

  const pops = C.list.filter(c => c.pos <= el && el - c.pos < POP_SECONDS).slice(-3);
  const key = id + '|' + Math.floor(el) + '|' + C.list.length;
  if (key === C.shown) return;
  C.shown = key;

  const popKey = pops.map(c => c.id).join();
  if ($('pops').dataset.k !== popKey) {
    $('pops').dataset.k = popKey;
    $('pops').replaceChildren(...pops.map(c => commentNode('div', c, 'pop')));
  }

  $('bar').querySelectorAll('.tick').forEach(n => n.remove());
  C.list.forEach(c => {
    const n = document.createElement('span'); n.className = 'tick';
    n.style.left = (100 * c.pos / t.duration) + '%'; n.title = fmt(c.pos);
    $('bar').append(n);
  });

  if (!C.list.length) {
    $('clist').dataset.k = '';
    const li = document.createElement('li'); const s = document.createElement('span');
    s.className = 'empty'; s.textContent = 'No comments on this track yet. Be the first.';
    li.append(s); $('clist').replaceChildren(li);
  } else {
    // Rebuild only when the comments change (so a click isn't lost mid-render); mark played ones each tick.
    const listKey = id + ':' + C.list.map(c => c.id).join();
    if ($('clist').dataset.k !== listKey) {
      $('clist').dataset.k = listKey;
      $('clist').replaceChildren(...C.list.map(c => {
        const li = document.createElement('li'); li.dataset.pos = c.pos;
        const tm = document.createElement('span'); tm.className = 't'; tm.textContent = fmt(c.pos);
        const s = commentNode('span', c, 's'); s.firstChild.remove();
        const sh = document.createElement('button'); sh.className = 'sh'; sh.textContent = '🔗';
        sh.title = 'Share this comment'; sh.setAttribute('aria-label', sh.title);
        sh.onclick = () => shareMoment(t, c.pos, c);
        li.append(tm, s, sh); return li;
      }));
    }
    for (const li of $('clist').children) li.classList.toggle('past', Number(li.dataset.pos) <= el);
  }
}

function loadTurnstile() {
  if (window.turnstile || document.getElementById('ts-js')) return;
  const s = document.createElement('script'); s.id = 'ts-js'; s.async = true;
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstile';
  document.head.append(s);
}
window.onTurnstile = () => { if (!$('cform').hidden) renderTurnstile(); };
function renderTurnstile() {
  if (!window.turnstile || C.widget !== null) return;
  C.widget = turnstile.render('#ts', {
    sitekey: C.siteKey, appearance: 'interaction-only', theme: 'dark',
    callback: tok => { C.token = tok; if (C.waiting) { C.waiting(); C.waiting = null; } },
    'expired-callback': () => { C.token = null; },
  });
}
const tokenReady = () => C.token ? Promise.resolve() : new Promise(r => { C.waiting = r; });

function openComment() {
  const { i, el } = heard(), t = S.tracks[i];
  C.draft = { track: trackId(t), pos: Math.round(el * 10) / 10 };
  $('cat').textContent = `Comment at ${fmt(el)} in ${t.song}${t.jam ? ` (jam ${t.jam})` : ''}`;
  $('cnick').value = store.get('nickname');
  $('cmsg').textContent = '';
  $('cform').hidden = false;
  $('cbody').focus();
  loadTurnstile(); renderTurnstile();
}
function closeComment() { $('cform').hidden = true; $('cbody').value = ''; $('ccount').textContent = '0/280'; C.draft = null; }

async function postComment(e) {
  e.preventDefault();
  const body = $('cbody').value.trim();
  if (!body || !C.draft) return;
  const nickname = $('cnick').value.trim();
  store.set('nickname', nickname);
  $('cpost').disabled = true; $('cmsg').textContent = C.token ? '' : 'Checking…';
  try {
    await tokenReady();
    const r = await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...C.draft, nickname, body, token: C.token }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { $('cmsg').textContent = data.error || 'Couldn\'t post. Try again.'; return; }
    if (C.draft.track === C.track) { C.list = [...C.list, data.comment].sort((a, b) => a.pos - b.pos); C.shown = ''; }
    closeComment();
  } catch (err) {
    $('cmsg').textContent = 'Couldn\'t post. Try again.';
  } finally {
    $('cpost').disabled = false;
    C.token = null; if (window.turnstile && C.widget !== null) turnstile.reset(C.widget);
  }
}

$('fire').onclick = react;
$('cbtn').onclick = () => $('cform').hidden ? openComment() : closeComment();
$('ccancel').onclick = closeComment;
$('cform').onsubmit = postComment;
$('cbody').oninput = e => $('ccount').textContent = `${e.target.value.length}/280`;

// Shared moments: /?m=<track>@<seconds>[&c=<comment id>] opens with a card counting down to when it airs.
const M = (() => {
  const q = new URLSearchParams(location.search);
  const m = /^(\d{4}-\d{2}-\d{2}-\d{2}(?:-jam\d+)?)@(\d{1,5})$/.exec(q.get('m') || '');
  return m && { track: m[1], pos: Number(m[2]), commentId: q.get('c'), i: -1 };
})();

function momentUrl(t, pos, c) {
  return `${location.origin}/?m=${trackId(t)}@${Math.floor(pos)}` + (c ? `&c=${c.id}` : '');
}

async function shareMoment(t, pos, c) {
  const url = momentUrl(t, pos, c);
  const text = c ? `“${c.body}” — ${t.song} @ ${fmt(pos)}` : `${t.song}${t.jam ? ` (jam ${t.jam})` : ''} @ ${fmt(pos)} on Biscuits Jam Radio`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Biscuits Jam Radio', text, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch (e) { prompt('Copy this link:', url); }
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 2200);
}

function initMoment() {
  if (!M) return;
  M.i = S.tracks.findIndex(t => trackId(t) === M.track);
  const t = S.tracks[M.i];
  $('moment').hidden = false;
  if (!t || M.pos > t.duration) {
    $('msong').textContent = 'This moment isn\'t on the air anymore';
    $('mwhen').textContent = '';
    M.i = -1; return;
  }
  $('msong').textContent = `${t.song}${t.jam ? ` (jam ${t.jam})` : ''} @ ${fmt(M.pos)}`;
  $('mshow').textContent = showLine(t);
  if (M.commentId) fetch('/api/comments?id=' + encodeURIComponent(M.commentId))
    .then(r => r.ok ? r.json() : null).then(d => {
      if (d && d.comment && d.comment.track === M.track) {
        const n = commentNode('div', d.comment); n.firstChild.remove();
        $('mcomment').replaceChildren(...n.childNodes); $('mcomment').hidden = false;
      }
    }).catch(() => {});
}

function renderMoment() {
  if (!M || M.i < 0 || $('moment').hidden) return;
  const now = live();
  const playingIt = now.i === M.i && now.offset >= M.pos && now.offset - M.pos < POP_SECONDS;
  $('mwhen').classList.toggle('now', playingIt);
  if (playingIt) { $('mwhen').textContent = listening ? '🔥 You\'re hearing it right now' : '🔥 On air right now. Tune in!'; return; }
  const wait = ((starts[M.i] + M.pos - now.pos) % total + total) % total;
  const at = new Date(Date.now() + wait * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('mwhen').textContent = wait < 3600 ? `Airs in ${fmt(wait)} (at ${at})` : `Airs again at ${at}, in ${fmt(wait)}`;
}

$('mclose').onclick = () => { $('moment').hidden = true; history.replaceState(null, '', location.pathname); };
$('share').onclick = () => { const { i, el } = heard(); shareMoment(S.tracks[i], el); };

fetch('schedule.json').then(r => r.json()).then(data => {
  S = data;
  S.tracks.forEach(t => { starts.push(total); total += t.duration; });
  initMoment();
  render(); setInterval(render, 1000);
  fetch('/api/config').then(r => r.ok ? r.json() : null).then(cfg => {
    if (!cfg || !cfg.comments) return;
    C.on = true; C.siteKey = cfg.turnstileSiteKey;
    $('cbtn').hidden = false; $('fire').hidden = false; $('share').hidden = false; $('talk').hidden = false;
    render();
    setInterval(() => { if (C.track && document.visibilityState === 'visible') loadMoments(C.track); }, 10000);
    pollListeners(); setInterval(pollListeners, 60000);
  }).catch(() => {});
});
</script>
